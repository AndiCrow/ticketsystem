{% extends 'base.html' %}
{% block content %}
<h1>Neues Ticket erstellen</h1>
<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form.as_p }}

    <a href="{% url 'ticket_list' %}" class="btn btn-secondary">Abbrechen</a>
</form>
{% endblock %}
